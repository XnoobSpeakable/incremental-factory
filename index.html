<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incremental Factory</title>
    <script type="module" src="/src/main.ts"></script>
</head>

<body>

    <div class="flexhorizontal">
        <div class="flexvertical" id="leftpanel">
            <div>Resources:</div>
            <div id="wooddisplay">Wood: 0</div>
            <div id="coaldisplay">Coal: 0</div>
            <div id="stonedisplay">Stone: 0</div>
            <div>Manual tools:</div>
            <div id="handdrilldisplay">Hand Drills: 0</div>
            <div>Automation:</div>
            <div>[nothing]</div>
        </div>
        <div class="flexvertical">
            <button id="minewood">Mine Wood</button>
            <button id="minestone">Mine Stone</button>
            <button id="minecoal">Mine Coal</button>
        </div>
        <div class="flexvertical">
            <button id="crafthanddrill">Craft Hand Drill</button>
        </div>
    </div>
    
    <div id="version">v. alpha0.1.0</div>
    
    <div id="bottomright" class="flexvertical">
        <div id="recipe">Crafting recipe: none</div>
    </div>

</body>

</html>
